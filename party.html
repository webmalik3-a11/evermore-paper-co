e8d6;--soft:#cfc6b0;--g:#d2b272;--field:#1c3227;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.45;min-height:100%}
.evp.ivory{--bg:#ece5d6;--card:#f6f0e4;--ink:#3a3c32;--soft:#6f6a5c;--g:#a8843f;--field:#fffdf8}
.evp .wrap{max-width:520px;margin:0 auto;padding:18px 14px 40px}
.evp .card{background:var(--card);border:1px solid var(--g);outline:1px solid var(--g);outline-offset:-6px;padding:30px 22px;margin:0 0 14px;text-align:center}
.evp .hero{padding-top:34px}
.evp canvas{display:block;margin:0 auto 6px}
.evp .eyebrow{font-family:Jost,Arial,sans-serif;font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;margin:10px 0 0;color:var(--ink)}
.evp .eyebrow.sm{margin-top:14px;font-size:10.5px;color:var(--soft)}
.evp h1{font-family:"Pinyon Script",cursive;font-weight:400;font-size:62px;line-height:1.05;margin:6px 0 2px;color:var(--g)}
.evp h1.lg{font-size:48px}
.evp h2{font-weight:500;font-size:27px;margin:6px 0 10px}
.evp .hosts{font-size:28px;font-weight:500;margin-top:2px}
.evp .lead{font-style:italic;color:var(--soft);margin:10px 0 0}
.evp .date{font-family:Jost,Arial,sans-serif;font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-top:20px;padding:18px 14px 0;border-top:1px solid var(--g);display:inline-block}
.evp .time,.evp .city{font-family:Jost,Arial,sans-serif;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;margin-top:8px}
.evp .city{color:var(--soft)}
.evp .count{display:flex;justify-content:center;gap:26px;margin:14px 0 6px}
.evp .count b{display:block;font-size:40px;font-weight:500;color:var(--g);line-height:1}
.evp .count span{font-family:Jost,Arial,sans-serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.evp .btn{display:inline-block;font-family:Jost,Arial,sans-serif;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--ink);border:1px solid var(--g);padding:11px 16px;margin:12px 4px 0;background:none;cursor:pointer}
.evp .btn.solid{background:var(--g);color:#1c3227;width:100%;margin:16px 0 0;padding:14px}
.evp .sched{list-style:none;padding:0;text-align:left;max-width:330px;margin:0 auto}
.evp .sched li{display:flex;gap:16px;padding:9px 0;border-bottom:1px solid rgba(190,154,92,.35)}
.evp .sched .t{font-family:Jost,Arial,sans-serif;font-size:12px;letter-spacing:.14em;min-width:76px;color:var(--g);padding-top:4px}
.evp .addr,.evp .by{color:var(--soft)}
.evp form{text-align:left;margin-top:8px}
.evp label{display:block;font-family:Jost,Arial,sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin:14px 0 5px;color:var(--soft)}
.evp input,.evp select,.evp textarea{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 11px;border:1px solid var(--g);background:var(--field);color:var(--ink);border-radius:0}
.evp .info{text-align:left}.evp .info p{margin:0 0 12px}.evp .info b{display:block;font-family:Jost,Arial,sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);margin-bottom:2px}
.evp .foot{text-align:center;font-style:italic;color:var(--soft);margin-top:18px}
.evp .hidden{display:none}
.evp .msgbox{max-width:420px;margin:18vh auto;text-align:center;padding:0 20px}

<script>/* Evermore party invitation engine: link encode/decode, guest page render, printable invitation drawing. */
var EVP = (function(){
  function b64u(bytes){var s='';for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
  async function pipe(bytes,stream){var r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer());}
  async function encode(obj){
    var raw=new TextEncoder().encode(JSON.stringify(obj));
    if(typeof CompressionStream!=='undefined'){try{return 'z'+b64u(await pipe(raw,new CompressionStream('deflate-raw')));}catch(e){}}
    return 'p'+b64u(raw);
  }
  async function decode(s){
    var kind=s.charAt(0),bytes=unb64u(s.slice(1));
    if(kind==='z')bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function safeUrl(u){u=(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function pad(n){return (n<10?'0':'')+n;}
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function parseDate(d,t){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');if(!m)return null;var tm=/^(\d{1,2}):(\d{2})$/.exec(t||'');return new Date(+m[1],+m[2]-1,+m[3],tm?+tm[1]:12,tm?+tm[2]:0,0);}
  function fmtDate(dt){return DAY[dt.getDay()]+', '+dt.getDate()+' '+MON[dt.getMonth()]+' '+dt.getFullYear();}
  function fmtShort(dt){return dt.getDate()+' '+MON[dt.getMonth()];}
  function fmtTime(t){var m=/^(\d{1,2}):(\d{2})$/.exec(t||'');if(!m)return t||'';var h=+m[1],ap=h>=12?'PM':'AM';h=h%12||12;return h+(m[2]==='00'?'':':'+m[2])+' '+ap;}
  function stamp(dt){return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+'T'+pad(dt.getHours())+pad(dt.getMinutes())+'00';}
  function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');}
  var THEMES={e:{bg:'#1c3227',card:'#253f34',ink:'#f0e8d6',soft:'#cfc6b0',g1:'#be9a5c',g2:'#e8d096',field:'#1c3227'},
              i:{bg:'#ece5d6',card:'#f6f0e4',ink:'#3a3c32',soft:'#6f6a5c',g1:'#a07a3e',g2:'#c6a464',field:'#fffdf8'}};
  function theme(d){return THEMES[d&&d.th==='i'?'i':'e'];}

  /* ---------- artwork (canvas 2D) ---------- */
  function gold(ctx,x0,x1,T){var g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,T.g1);g.addColorStop(.35,T.g2);g.addColorStop(.7,T.g1);g.addColorStop(1,T.g2);return g;}
  function leaf(ctx,x,y,ang,L,W){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(L*.3,-W*1.25,L*.75,-W*.95,L,0);ctx.bezierCurveTo(L*.75,W*.95,L*.3,W*1.25,0,0);ctx.fill();ctx.restore();}
  function star(ctx,x,y,r){ctx.beginPath();for(var i=0;i<8;i++){var a=Math.PI/4*i-Math.PI/2,rr=i%2?r*.22:r;ctx[i?'lineTo':'moveTo'](x+rr*Math.cos(a),y+rr*Math.sin(a));}ctx.closePath();ctx.fill();}
  function garland(ctx,cx,cy,halfW,leafLen){
    for(var s=-1;s<=1;s+=2){var n=7,prev=null;
      for(var i=0;i<=n;i++){var t=i/n,x=cx+s*(leafLen*.65+halfW*t),y=cy-Math.sin(t*Math.PI)*leafLen*.28+t*leafLen*.10;
        if(prev){ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(x,y);ctx.lineWidth=Math.max(1,leafLen*.045);ctx.stroke();}
        prev=[x,y];if(!i)continue;
        var size=leafLen*(.62+.55*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.15)),.8))*(1-.25*t),base=s===1?0:Math.PI,tilt=38*Math.PI/180;
        leaf(ctx,x,y,base-s*tilt,size,size*.24);
        if(i<n)leaf(ctx,x-s*halfW/n*.5,y+size*.02,base+s*tilt,size*.92,size*.22);else leaf(ctx,x,y,base,size*.9,size*.2);

  }
  function corner(ctx,x,y,sx,sy,r){var st={'1,1':0,'-1,1':.5,'-1,-1':1,'1,-1':1.5}[sx+','+sy]*Math.PI;ctx.lineWidth=Math.max(1,r*.035);
    ctx.beginPath();ctx.arc(x,y,r,st,st+Math.PI/2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.62,st,st+Math.PI/2);ctx.stroke();star(ctx,x+sx*r*.3,y+sy*r*.3,r*.16);}
  function garlandCanvas(T,w){var c=document.createElement('canvas'),r=Math.min(3,window.devicePixelRatio||2);c.width=w*r;c.height=w*.22*r;c.style.width=w+'px';c.style.height=(w*.22)+'px';
    var x=c.getContext('2d');x.scale(r,r);x.fillStyle=x.strokeStyle=gold(x,0,w,T);garland(x,w/2,w*.12,w*.30,w*.085);return c;}

  /* ---------- guest page ---------- */
  function render(d,root,opts){
    opts=opts||{};var T=theme(d);root.innerHTML='';root.className='evp '+(d.th==='i'?'ivory':'emerald');
    var w=el('div','wrap');root.appendChild(w);
    var title=d.tt||'Christmas Party',hosts=d.h||'',dt=parseDate(d.d,d.t);
    var c=el('section','card hero');w.appendChild(c);
    c.appendChild(garlandCanvas(T,opts.gw||260));
    c.appendChild(el('p','eyebrow',d.ey||'You are invited to our'));
    c.appendChild(el('h1',title.length>18?'lg':null,title));
    if(hosts){c.appendChild(el('p','eyebrow sm','Hosted by'));c.appendChild(el('div','hosts',hosts));}
    if(d.msg)c.appendChild(el('p','lead',d.msg));
    if(dt){c.appendChild(el('div','date',fmtDate(dt)));if(d.t)c.appendChild(el('div','time',fmtTime(d.t)+(d.te?' to '+fmtTime(d.te):'')));}
    if(d.venue)c.appendChild(el('div','city',d.venue));
    if(dt){var cc=el('section','card');w.appendChild(cc);cc.appendChild(el('p','eyebrow','Counting down'));var box=el('div','count');cc.appendChild(box);
      var parts=[['Days'],['Hours'],['Minutes']].map(function(p){var x=el('div'),b=el('b',null,'0');x.appendChild(b);x.appendChild(el('span',null,p[0]));box.appendChild(x);return b;});
      var msgEl=el('p','lead');cc.appendChild(msgEl);
      var tick=function(){var ms=dt-(opts.now||new Date());if(ms<=0){box.classList.add('hidden');msgEl.textContent=ms>-86400000?'Today is the day.':'Thank you for celebrating with us.';return;}
        var mins=Math.floor(ms/60000);parts[0].textContent=Math.floor(mins/1440);parts[1].textContent=Math.floor(mins%1440/60);parts[2].textContent=mins%60;};
      tick();if(!opts.preview)setInterval(tick,30000);
      var end=d.te?parseDate(d.d,d.te):new Date(dt.getTime()+4*3600000);if(end<=dt)end=new Date(end.getTime()+86400000);
      var cal=title+(hosts?' ('+hosts+')':''),loc=[d.venue,d.addr].filter(Boolean).join(', ');
      var a1=el('a','btn','Google Calendar');a1.href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(cal)+'&dates='+stamp(dt)+'/'+stamp(end)+'&location='+encodeURIComponent(loc);a1.target='_blank';a1.rel='noopener';cc.appendChild(a1);
      var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Evermore//Party//EN\r\nBEGIN:VEVENT\r\nUID:'+stamp(dt)+'-'+Math.random().toString(36).slice(2)+'@party\r\nDTSTAMP:'+stamp(new Date())+'\r\nDTSTART:'+stamp(dt)+'\r\nDTEND:'+stamp(end)+'\r\nSUMMARY:'+icsEsc(cal)+'\r\nLOCATION:'+icsEsc(loc)+'\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';
      var a2=el('a','btn','Apple / Outlook');a2.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);a2.download='party.ics';cc.appendChild(a2);}
    var sch=(d.s||[]).filter(function(r){return r&&(r[0]||r[1]);});
    if(sch.length){var sc=el('section','card');w.appendChild(sc);sc.appendChild(el('p','eyebrow','The evening'));sc.appendChild(el('h2',null,d.sh||'What to expect'));
      var ul=el('ul','sched');sc.appendChild(ul);sch.forEach(function(r){var li=el('li');li.appendChild(el('div','t',fmtTime(r[0])));li.appendChild(el('div','w',r[1]||''));ul.appendChild(li);});}
    if(d.venue||d.addr){var vc=el('section','card');w.appendChild(vc);vc.appendChild(el('p','eyebrow','Where'));
      if(d.venue)vc.appendChild(el('h2',null,d.venue));if(d.addr)vc.appendChild(el('div','addr',d.addr));
      var mb=el('a','btn','Open map');mb.href=safeUrl(d.map)||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([d.venue,d.addr].filter(Boolean).join(', ')));mb.target='_blank';mb.rel='noopener';vc.appendChild(mb);}
    if(d.rm&&d.rm!=='none'){var rc=el('section','card');w.appendChild(rc);rc.appendChild(el('p','eyebrow','Kindly reply'));rc.appendChild(el('h2',null,'RSVP'));
      if(d.rb){var rbd=parseDate(d.rb);rc.appendChild(el('p','by','Please reply by '+(rbd?fmtShort(rbd):d.rb)));}
      if(d.rm==='form'){var fu=safeUrl(d.fu);if(fu){var fb=el('a','btn solid','Reply here');fb.href=fu;fb.target='_blank';fb.rel='noopener';rc.appendChild(fb);}}
      else{var f=el('form','rsvp');rc.appendChild(f);
        var field=function(lbl,node,parent){(parent||f).appendChild(el('label',null,lbl));(parent||f).appendChild(node);return node;};
        var nm=field('Your name',el('input'));nm.required=true;nm.maxLength=120;nm.autocomplete='name';
        var att=el('select');[['yes','Yes, I will be there'],['no','Sorry, I cannot make it']].forEach(function(o){var op=el('option',null,o[1]);op.value=o[0];att.appendChild(op);});field('Are you coming?',att);
        var yes=el('div');f.appendChild(yes);
        var gs=el('input');gs.type='number';gs.min='1';gs.max='20';gs.value='1';gs.inputMode='numeric';field('How many of you, including you?',gs,yes);
        var diet=null;if(d.df!=='0'){diet=el('input');diet.maxLength=200;diet.placeholder='Vegetarian, allergies, none';field('Dietary needs (optional)',diet,yes);}
        var extra=null;if(d.ml){extra=el('input');extra.maxLength=200;field(d.ml,extra,yes);}
        att.addEventListener('change',function(){yes.classList.toggle('hidden',att.value!=='yes');});
        var note=field('A note for the host (optional)',el('textarea'));note.rows=3;note.maxLength=500;
        var useWa=d.rm==='wa',sb=el('button','btn solid',useWa?'Send RSVP by WhatsApp':'Send RSVP by email');sb.type='submit';f.appendChild(sb);
        var text=function(){var y=att.value==='yes',L=['RSVP: '+title+(hosts?' ('+hosts+')':''),'Name: '+nm.value.trim(),'Coming: '+(y?'Yes':'No')];
          if(y){L.push('Guests: '+(gs.value||'1'));if(diet&&diet.value.trim())L.push('Dietary needs: '+diet.value.trim());if(extra&&extra.value.trim())L.push(d.ml+': '+extra.value.trim());}
          if(note.value.trim())L.push('Note: '+note.value.trim());return L.join('\n');};
        f.addEventListener('submit',function(ev){ev.preventDefault();if(opts.preview)return;if(d.demo){sb.textContent='Sample only. On your invitation this opens '+(useWa?'WhatsApp':'email');return;}
          if(!nm.value.trim()){nm.focus();return;}
          if(useWa)window.open('https://wa.me/'+String(d.wa||'').replace(/[^\d]/g,'')+'?text='+encodeURIComponent(text()),'_blank');
          else window.location.href='mailto:'+encodeURIComponent((d.em||'').trim()).replace(/%40/g,'@')+'?subject='+encodeURIComponent('RSVP: '+nm.value.trim())+'&body='+encodeURIComponent(text());
          sb.textContent='Thank you. Finish sending in the app that opened';});}}
    var info=[['Dress code',d.dc],['Gift exchange',d.gx],['What to bring',d.br],['A note from us',d.nt]].filter(function(x){return x[1];});
    if(info.length){var ic=el('section','card');w.appendChild(ic);ic.appendChild(el('p','eyebrow','Good to know'));ic.appendChild(el('h2',null,'Details'));var b2=el('div','info');ic.appendChild(b2);
      info.forEach(function(x){var p=el('p');p.appendChild(el('b',null,x[0]));p.appendChild(document.createTextNode(x[1]));b2.appendChild(p);});}
    w.appendChild(el('div','foot',d.sig||(hosts?'See you there. '+hosts:'')));
  }

  /* ---------- printable invitation, 5 x 7 in at 300 DPI ---------- */
  function tracked(ctx,text,cx,y,tr){var ws=[],tot=0;for(var i=0;i<text.length;i++){var w=ctx.measureText(text[i]).width;ws.push(w);tot+=w+(i<text.length-1?tr:0);}var x=cx-tot/2;ctx.textAlign='left';for(i=0;i<text.length;i++){ctx.fillText(text[i],x,y);x+=ws[i]+tr;}ctx.textAlign='center';}
  function fit(ctx,text,font,size,maxW,min){do{ctx.font=font.replace('%px',size+'px');if(ctx.measureText(text).width<=maxW)break;size-=4;}while(size>min);return size;}
  function wrap(ctx,text,maxW,maxLines){var words=String(text).split(/\s+/),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});if(cur)lines.push(cur);return lines.slice(0,maxLines);}
  function drawInvite(cv,d,qr){
    var W=1500,H=2100,T=theme(d),x=cv.getContext('2d');cv.width=W;cv.height=H;
    x.fillStyle=T.card;x.fillRect(0,0,W,H);
    var G=gold(x,0,W,T);x.strokeStyle=G;x.fillStyle=G;
    x.lineWidth=5;x.strokeRect(60,60,W-120,H-120);x.lineWidth=2;x.strokeRect(76,76,W-152,H-152);
    [[1,1,76,76],[-1,1,W-76,76],[-1,-1,W-76,H-76],[1,-1,76,H-76]].forEach(function(c){corner(x,c[2],c[3],c[0],c[1],64);});
    garland(x,W/2,300,300,84);
    x.textAlign='center';x.textBaseline='alphabetic';
    var title=d.tt||'Christmas Party',hosts=d.h||'',dt=parseDate(d.d,d.t),hasQr=!!qr;
    x.fillStyle=T.ink;x.font='36px Jost';tracked(x,(d.ey||'You are invited to our').toUpperCase(),W/2,500,12);
    x.fillStyle=G;var ts=fit(x,title,'%px "Pinyon Script"',205,1010,100);x.font=ts+'px "Pinyon Script"';x.fillText(title,W/2,500+ts*1.02);
    var y=500+ts*1.02+86;star(x,W/2,y,16);y+=96;
    if(hosts){x.fillStyle=T.ink;x.font='32px Jost';tracked(x,'HOSTED BY',W/2,y,11);y+=104;var hs=fit(x,hosts,'500 %px "Cormorant Garamond"',100,1100,56);x.font='500 '+hs+'px "Cormorant Garamond"';x.fillText(hosts,W/2,y);y+=92;}
    if(d.msg){x.fillStyle=T.soft;x.font='italic 500 50px "Cormorant Garamond"';wrap(x,d.msg,1050,2).forEach(function(l){x.fillText(l,W/2,y);y+=62;});y+=34;}
    x.fillStyle=G;x.fillRect(W/2-150,y-22,300,2);y+=62;
    x.fillStyle=T.ink;
    if(dt){x.font='44px Jost';tracked(x,fmtDate(dt).toUpperCase().replace(', ',' · '),W/2,y,10);y+=78;if(d.t){x.font='40px Jost';tracked(x,(fmtTime(d.t)+(d.te?' TO '+fmtTime(d.te):'')).toUpperCase(),W/2,y,10);y+=104;}}
    if(d.venue){var vs=fit(x,d.venue,'500 %px "Cormorant Garamond"',72,1150,44);x.font='500 '+vs+'px "Cormorant Garamond"';x.fillText(d.venue,W/2,y);y+=66;}
    if(d.addr){x.fillStyle=T.soft;x.font='500 46px "Cormorant Garamond"';wrap(x,d.addr,1100,2).forEach(function(l){x.fillText(l,W/2,y);y+=56;});}
    var rb=d.rb?parseDate(d.rb):null,rline=rb?'RSVP BY '+fmtShort(rb).toUpperCase():(d.dc?('DRESS CODE  ·  '+d.dc.toUpperCase()):'');
    if(hasQr){var q=qr.getModuleCount(),box=236,cell=Math.floor((box-36)/q),sz=cell*q,bx=W/2-box/2,by=H-150-box-58;
      x.fillStyle='#fffdf8';x.fillRect(bx,by,box,box);x.strokeStyle=G;x.lineWidth=3;x.strokeRect(bx,by,box,box);x.fillStyle='#1c3227';
      var ox=W/2-sz/2,oy=by+(box-sz)/2;for(var r=0;r<q;r++)for(var c=0;c<q;c++)if(qr.isDark(r,c))x.fillRect(ox+c*cell,oy+r*cell,cell,cell);
      x.fillStyle=T.ink;x.font='30px Jost';tracked(x,('SCAN TO REPLY'+(rb?'  ·  BY '+fmtShort(rb).toUpperCase():'')),W/2,H-150,9);}
    else if(rline){x.fillStyle=T.ink;x.font='32px Jost';tracked(x,rline,W/2,H-170,9);}
  }
  return {encode:encode,decode:decode,render:render,drawInvite:drawInvite,theme:theme,parseDate:parseDate};
})();
</script>
<script>
(async function(){var app=document.getElementById('app'),h=location.hash.slice(1);
  var SAMPLE={demo:1,tt:'Christmas Party',h:'Emma & James',msg:'Join us for festive food, drinks and good company',d:'2026-12-19',t:'18:30',venue:'The Old Mill House',addr:'12 River Lane, Bath',s:[['18:30','Welcome drinks'],['19:30','Dinner is served'],['21:00','Games and Secret Santa']],rm:'wa',wa:'0',rb:'2026-12-12',ml:'What will you bring?',dc:'Festive and cosy',gx:'Secret Santa, up to $20'};
  function msg(a,b){app.innerHTML='';var m=document.createElement('div');m.className='msgbox';var p=document.createElement('p');p.className='eyebrow';p.textContent=a;var q=document.createElement('p');q.className='lead';q.textContent=b;m.appendChild(p);m.appendChild(q);app.appendChild(m);}
  window.addEventListener('hashchange',function(){location.reload();});
  try{await document.fonts.ready;}catch(e){}
  if(!h)return msg('Evermore party invitations','Ask your host for the full invitation link.');
  if(h==='sample'||h==='sample-ivory'){if(h==='sample-ivory')SAMPLE.th='i';EVP.render(SAMPLE,app);document.body.style.background=EVP.theme(SAMPLE).bg;return;}
  try{var d=await EVP.decode(h);EVP.render(d,app);document.body.style.background=EVP.theme(d).bg;document.title=(d.tt||'Party')+(d.h?' | '+d.h:'');}
  catch(e){msg('This invitation link looks incomplete','Please ask your host to send the full link again.');}
})();
